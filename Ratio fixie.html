<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ratio fixie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#dcd8cc;--card:#e9e6dc;--ink:#141413;--mute:#6b6a62;--dim:rgba(20,20,19,.14);
  --lime:#e2f45c;--lime-ink:#141413;--blue:#2447ff;--dark:#1c1c1b;--dark-ink:#ecebe5;--dark-dim:#3e3e3b;
  --sans:"Space Grotesk",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c0c0b;--card:#161615;--ink:#ecebe5;--mute:#8d8c83;--dim:rgba(236,235,229,.14);
  --blue:#6d84ff;--dark:#0c0c0b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c0c0b;--card:#161615;--ink:#ecebe5;--mute:#8d8c83;--dim:rgba(236,235,229,.14);--blue:#6d84ff;--dark:#0c0c0b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;
  padding:20px max(14px,env(safe-area-inset-right)) 36px max(14px,env(safe-area-inset-left))}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px}
h1{font:400 15px/1 var(--mono);margin:0;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:12px;height:12px;background:var(--lime);outline:1px solid var(--ink)}
.grid{display:grid;gap:10px;grid-template-columns:1fr;grid-template-areas:"hero" "set" "wheel" "tbl"}
@media (min-width:780px){.grid{grid-template-columns:1fr 1fr;grid-template-areas:"hero hero" "set wheel" "tbl tbl"}}
.set{grid-area:set}.hero{grid-area:hero}.wheelc{grid-area:wheel}.tbl{grid-area:tbl}
.card{background:var(--card);padding:22px;position:relative}
.tag{font:400 12px/1 var(--mono);color:var(--mute);margin:0 0 22px;display:flex;align-items:center;gap:8px}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.field{margin-bottom:20px}.field:last-child{margin-bottom:0}
label{display:block;font:400 12px/1 var(--mono);color:var(--mute);margin-bottom:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;background:var(--bg)}
.stepper button{width:46px;border:0;background:transparent;color:var(--ink);font:300 24px var(--sans);cursor:pointer}
.stepper button:hover{background:var(--lime);color:var(--lime-ink)}
.stepper input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);text-align:center;font:300 34px var(--sans);letter-spacing:-.03em;padding:8px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select,.plain{width:100%;border:0;border-radius:0;background:var(--bg);color:var(--ink);font:400 14px var(--mono);padding:14px 12px}
#custom{margin-top:6px}
.seg{display:inline-flex;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--mute);font:400 13px var(--mono);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stepper:focus-within{outline:2px solid var(--blue);outline-offset:2px}.stepper input:focus-visible{outline:none}

.hero{background:var(--lime);color:var(--lime-ink);overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.hero .tag{color:var(--lime-ink);opacity:.7;position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:0 0 0 38%;
  background:radial-gradient(circle,rgba(20,20,19,.5) 1.6px,transparent 2.2px) 0 0/16px 16px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
.big{font-size:clamp(88px,22vw,190px);font-weight:300;letter-spacing:-.06em;line-height:.9;margin:0 0 26px;position:relative;z-index:1}
.big small{font:400 .13em var(--mono);letter-spacing:0;margin-left:.4em}
dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.line{background:var(--lime-ink);color:var(--lime);padding:12px 14px}
.line dt{font:400 12px/1 var(--mono);opacity:.7;margin-bottom:8px}
.line dd{margin:0;font:300 28px/1 var(--sans);letter-spacing:-.03em}
.line dd small{font:400 12px var(--mono);letter-spacing:0;margin-left:6px;opacity:.7}

.wheelc{background:var(--dark);color:var(--dark-ink)}
.wheelc .tag{color:#8d8c83}
.wheelrow{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
#wheel{width:236px;height:236px;flex:none}
.rg{fill:none;stroke:var(--dark-dim);stroke-width:1.5}.tk{fill:none;stroke:var(--dark-dim);stroke-width:1}
.m1{fill:var(--lime)}
.legend{display:grid;gap:16px;min-width:140px}
.legend div{display:flex;align-items:center;gap:12px}
.legend i{width:12px;height:12px;flex:none;background:var(--lime)}
.legend i.o{background:var(--dark-dim);border:0;border-radius:0}
.legend b{font:300 42px/1 var(--sans);letter-spacing:-.04em;min-width:44px}
.legend span{font:400 12px var(--mono);color:#8d8c83}

ul{list-style:none;margin:0;padding:0}
.sp{display:grid;grid-template-columns:92px 1fr 92px;align-items:center;gap:14px;padding:6px 0}
.sp .c{font:400 12px var(--mono);color:var(--mute)}
.bar{display:grid;grid-template-columns:repeat(24,1fr);gap:3px}
.bar i{aspect-ratio:1;background:var(--dim)}
.bar i.on{background:var(--blue)}
.sp .v{text-align:right;font:400 22px/1 var(--sans);letter-spacing:-.02em}
.sp .v small{font:400 11px var(--mono);color:var(--mute);margin-left:4px}
.sp.cur{background:var(--bg);margin:0 -10px;padding:6px 10px}
.sp.cur .c,.sp.cur .v{color:var(--ink)}
.cad{display:flex;align-items:center;gap:18px 28px;flex-wrap:wrap;margin:0 0 18px}
.cad output{font:300 clamp(48px,11vw,72px)/1 var(--sans);letter-spacing:-.05em}
.cad output small{font:400 13px var(--mono);letter-spacing:0;color:var(--mute);margin-left:8px}
.cs{margin-left:auto}
.cs output{min-width:96px;display:flex;align-items:baseline;justify-content:center;gap:5px;font:300 28px var(--sans);letter-spacing:-.03em;padding:8px 0}
.cs output small{font:400 11px var(--mono);letter-spacing:0;color:var(--mute);margin:0}
.gauge{gap:4px;margin:0 0 8px}
.ticks{display:flex;justify-content:space-between;font:400 11px var(--mono);color:var(--mute);margin:0}
.note{font:400 12px/1.4 var(--mono);color:var(--mute);margin:14px 0 0}
.alts{display:grid;grid-template-columns:1fr;gap:4px}
.alt{border:0;background:var(--bg);color:var(--ink);text-align:left;padding:9px 12px;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;font:400 13px var(--mono)}
.alt:hover{background:var(--lime);color:var(--lime-ink)}
.alt .ab{font:400 15px var(--mono);letter-spacing:-.02em}
.alt .dv{color:var(--mute)}
.alt:hover .dv{color:var(--lime-ink)}
.alt .pc{display:flex;align-items:center;gap:6px}
.alt .pc i{width:7px;height:7px;background:var(--lime);outline:1px solid var(--ink)}
.alt:hover .pc i{background:var(--lime-ink);outline:0}
.verdict{font:400 12px/1.5 var(--mono);color:#a3a29a;margin:0;max-width:210px}
@media (max-width:520px){.sp{grid-template-columns:70px 1fr 78px;gap:8px}.bar{gap:2px}.card{padding:16px}dl{grid-template-columns:1fr}}
/* tout dans l’écran : téléphone par défaut, ordinateur en dessous */
html,body{height:100%}
body{display:flex;flex-direction:column;padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left))}
.wrap{flex:1;min-height:0;width:100%;display:flex;flex-direction:column}
header{margin:0 0 8px}
.grid{flex:1;min-height:0;gap:8px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto minmax(190px,1fr);grid-template-areas:"hero hero" "set set" "wheel tbl"}
.card{padding:clamp(12px,2dvh,22px);min-width:0;min-height:0;display:flex;flex-direction:column}
.tag{margin:0 0 clamp(8px,1.6dvh,20px)}
.field{margin-bottom:clamp(10px,1.8dvh,20px)}.field:last-child{margin-bottom:0}
label{margin-bottom:6px}
.row2{gap:8px}.row2 > div{min-width:0}
.stepper button{width:40px}
.stepper input{width:0;font-size:clamp(24px,4dvh,34px);padding:6px 0}
select,.plain{padding:10px 12px}
.hero{min-height:0;gap:8px}
.hero > div{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 14px;flex-wrap:wrap}
.big{font-size:clamp(60px,min(19vw,12dvh),120px);margin:0}
dl{grid-template-columns:1fr;gap:6px;width:152px;min-width:0}
.line{padding:8px 10px}.line dt{margin-bottom:5px}.line dd{font-size:20px}
.alts{grid-template-columns:1fr 1fr;gap:4px}
.alt{grid-template-columns:1fr auto;grid-template-areas:"ab pc" "dv dv";gap:2px 8px;padding:7px 10px}
.alt .ab{grid-area:ab;font-size:15px}.alt .dv{grid-area:dv;font-size:11px}.alt .pc{grid-area:pc;font-size:12px}
.wheelc .tag{margin-bottom:8px}
.wheelrow{flex:1;min-height:0;flex-direction:column;flex-wrap:nowrap;gap:10px}
#wheel{flex:1 1 0;min-height:0;width:100%;height:auto;max-height:440px}
.legend{display:flex;gap:10px;min-width:0;width:100%;justify-content:space-around}
.legend div{display:grid;grid-template-columns:auto auto;grid-template-areas:"i b" "s s";gap:2px 6px;align-items:center;justify-content:center}
.legend i{grid-area:i;width:10px;height:10px}
.legend b{grid-area:b;font-size:clamp(20px,3dvh,28px);min-width:0}
.legend span{grid-area:s;font-size:11px;text-align:center}
.cad{flex-direction:column;align-items:stretch;gap:8px;margin:auto 0 12px}
.cad > output{font-size:clamp(38px,min(11vw,7dvh),72px)}
.cad > output small{display:block;margin:4px 0 0}
.cs{margin-left:0}
.cs button{width:36px}
.cs output{min-width:0;flex:1;font-size:24px}
.gauge{gap:2px;margin:0 0 6px}.gauge i{aspect-ratio:1/1.7}
.ticks{font-size:10px}
@media (min-width:700px){
  .grid{gap:10px;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(300px,1fr) auto;grid-template-areas:"hero hero" "set wheel" "tbl tbl"}
  .set{justify-content:flex-start}
  .hero > div{flex-direction:row;align-items:flex-end;flex-wrap:nowrap}
  .big{font-size:clamp(64px,min(13vw,17dvh),150px)}
  dl{width:auto;grid-template-columns:auto auto;gap:10px}.line dd{white-space:nowrap}
  .cad{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px}
  .cad > output{font-size:clamp(44px,min(6vw,9dvh),76px)}
  .cad > output small{display:inline;margin:0 0 0 10px}
  .cs{margin-left:auto;align-self:auto}
  .cs output{min-width:96px;flex:none;font-size:28px}
  .cs button{width:44px}
  .gauge{gap:4px}.gauge i{aspect-ratio:auto;height:clamp(16px,3.6dvh,32px)}
  .ticks{font-size:11px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ratio fixie</h1>
    <div class="seg" role="group" aria-label="Unités">
      <button type="button" data-unit="kmh" aria-pressed="true">km/h</button>
      <button type="button" data-unit="mph" aria-pressed="false">mph</button>
    </div>
  </header>

  <div class="grid">
    <section class="card hero" aria-label="Ratio" aria-live="polite">
      <p class="tag">ratio de transmission</p>
      <div>
        <p class="big" id="ratio">2,88</p>
        <dl>
          <div class="line"><dt id="devL">développement</dt><dd id="dev">—</dd></div>
          <div class="line"><dt>ratio réduit</dt><dd id="red">—</dd></div>
        </dl>
      </div>
    </section>

    <section class="card set" aria-label="Réglages">
      <p class="tag">réglages</p>
      <div class="row2 field">
        <div>
          <label for="f">plateau (dents)</label>
          <div class="stepper">
            <button type="button" data-step="f" data-d="-1" aria-label="Retirer une dent au plateau">−</button>
            <input id="f" type="number" inputmode="numeric" min="20" max="70" value="46">
            <button type="button" data-step="f" data-d="1" aria-label="Ajouter une dent au plateau">+</button>
          </div>
        </div>
        <div>
          <label for="r">pignon (dents)</label>
          <div class="stepper">
            <button type="button" data-step="r" data-d="-1" aria-label="Retirer une dent au pignon">−</button>
            <input id="r" type="number" inputmode="numeric" min="9" max="30" value="16">
            <button type="button" data-step="r" data-d="1" aria-label="Ajouter une dent au pignon">+</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label for="wheel-sel">roue et pneu</label>
        <select id="wheel-sel">
          <option value="2096">700 × 23c</option>
          <option value="2105" selected>700 × 25c</option>
          <option value="2136">700 × 28c</option>
          <option value="2155">700 × 32c</option>
          <option value="2168">700 × 35c</option>
          <option value="2200">700 × 40c</option>
          <option value="custom">Circonférence personnalisée</option>
        </select>
        <input id="custom" class="plain" type="number" inputmode="numeric" min="1000" max="3000" value="2105" placeholder="Circonférence en mm" aria-label="Circonférence en mm" hidden>
      </div>
      <div class="field">
        <label>combinaisons proches</label>
        <div class="alts" id="alts"></div>
      </div>
    </section>

    <section class="card wheelc" aria-label="Skid patches" aria-live="polite">
      <p class="tag">skid patches</p>
      <div class="wheelrow">
        <svg id="wheel" viewBox="0 0 240 240" role="img" aria-label="Roue"></svg>
        <div class="legend">
          <div><i></i><b id="sk1">—</b><span>un pied</span></div>
          <div><i class="o"></i><b id="sk2">—</b><span>ambidextre</span></div>
        </div>
      </div>
    </section>

    <section class="card tbl" aria-label="Tableau de vitesse">
      <p class="tag">vitesse selon la cadence</p>
      <div class="cad"><output id="cadv" aria-live="polite"></output><div class="stepper cs"><button type="button" data-cd="-10" aria-label="Baisser la cadence">−</button><output id="cadn" aria-label="Cadence en tours par minute"></output><button type="button" data-cd="10" aria-label="Augmenter la cadence">+</button></div></div>
      <div class="bar gauge" id="gauge" aria-hidden="true"></div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const S = {f:46, r:16, mm:2105, unit:'kmh', cad:90};
const speedAt = (f, r, c) => { const k = f / r * S.mm * c * 60 / 1e6; return KMH() ? k : k / 1.609344; };
function similar(){
  const ratio = S.f / S.r, out = [];
  for (let f = 34; f <= 62; f++) for (let r = 12; r <= 24; r++){
    if (f === S.f && r === S.r) continue;
    const d = (f / r - ratio) / ratio;
    if (Math.abs(d) > .05 || out.some(o => o.f * r === f * o.r)) continue;
    out.push({f, r, d, p: r / gcd(f, r)});
  }
  const good = out.filter(o => o.p >= 8).sort((a, b) => Math.abs(a.d) - Math.abs(b.d));
  const rest = out.filter(o => o.p < 8).sort((a, b) => b.p - a.p || Math.abs(a.d) - Math.abs(b.d));
  return good.concat(rest).slice(0, 4).sort((a, b) => a.d - b.d);
}
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const gcd = (a,b) => b ? gcd(b, a % b) : a;
const nf = (n,d=2) => n.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const KMH = () => S.unit === 'kmh';

function wheelSVG(rp){
  const z = rp > 20 ? 5.5 : rp > 8 ? 7 : 8.5, T = Math.PI * 2, top = -Math.PI / 2;
  const P = (a, R) => (120 + R * Math.cos(a)).toFixed(1) + ' ' + (120 + R * Math.sin(a)).toFixed(1);
  let s = '<circle class="rg" cx="120" cy="120" r="100"/><circle class="tk" cx="120" cy="120" r="84"/>';
  for (let c = 0; c < 4; c++) s += '<path class="tk" d="M' + P(c * Math.PI / 2, 110) + ' L' + P(c * Math.PI / 2, 119) + '"/>';
  s += '<path class="tk" d="M112 120H128M120 112V128"/>';
  for (let k = 0; k < rp; k++){
    const a = top + k * T / rp;
    s += '<path class="tk" d="M' + P(a, 84) + ' L' + P(a, 96) + '"/>';
    s += '<rect class="m1" x="' + (-z / 2) + '" y="' + (-z / 2) + '" width="' + z + '" height="' + z + '" transform="translate(' +
      P(a, 100) + ') rotate(' + (a * 180 / Math.PI).toFixed(1) + ')"/>';
  }
  return s;
}

function render(){
  const ratio = S.f / S.r, dev = ratio * S.mm / 1000;
  const g = gcd(S.f, S.r), fp = S.f / g, rp = S.r / g;
  const amb = fp % 2 ? rp * 2 : rp;

  $('ratio').innerHTML = nf(ratio) + '<small>:1</small>';
  $('devL').textContent = KMH() ? 'développement' : 'gear inches';
  $('dev').innerHTML = KMH() ? nf(dev) + '<small>m / tour</small>' : nf(ratio * S.mm / Math.PI / 25.4, 1) + '<small>pouces</small>';
  
  
  $('red').textContent = fp + ' : ' + rp;
  $('sk1').textContent = rp;
  $('sk2').textContent = amb;
  $('wheel').innerHTML = wheelSVG(rp);
  $('wheel').setAttribute('aria-label', 'Roue : ' + rp + ' skid patches à un pied, ' + amb + ' en ambidextre');

  const cads = [60,70,80,90,100,110,120,130];
  const sp = c => { const k = dev * c * 60 / 1000; return KMH() ? k : k / 1.609344; };
  const cap = KMH() ? 60 : 36, u = KMH() ? 'km/h' : 'mph';
  
  $('cadn').innerHTML = S.cad + '<small>tr/min</small>';
  const gn = clamp(Math.round(sp(S.cad) / cap * 24), 0, 24);
  let gs = '';
  for (let i = 0; i < 24; i++) gs += i < gn ? '<i class="on"></i>' : '<i></i>';
  $('gauge').innerHTML = gs;
  $('ticks').innerHTML = [0, 1, 2, 3].map(k => '<span>' + nf(cap * k / 3, 0) + (k === 3 ? ' ' + u : '') + '</span>').join('');
  $('cadv').innerHTML = nf(sp(S.cad), 1) + '<small>' + u + ' à ' + S.cad + ' tr/min</small>';
  
  const cur = sp(S.cad), al = similar();
  $('alts').innerHTML = al.map(o => {
    const dv = speedAt(o.f, o.r, S.cad) - cur;
    return '<button type="button" class="alt" data-f="' + o.f + '" data-r="' + o.r + '" aria-label="Appliquer ' + o.f + ' par ' + o.r + '"><span class="ab">' + o.f + '×' + o.r +
      '</span><span class="dv">' + (dv < 0 ? '−' : '+') + nf(Math.abs(dv), 1) + ' ' + u +
      '</span><span class="pc"><i></i>' + o.p + '</span></button>';
  }).join('');
  
  try { localStorage.setItem('fixie2', JSON.stringify(S)); } catch(e){}
}

function teeth(key, raw, final){
  const lim = key === 'f' ? [20,70] : [9,30];
  const v = parseInt(raw, 10);
  if (isNaN(v) || (!final && (v < lim[0] || v > lim[1]))) return;
  S[key] = clamp(v, lim[0], lim[1]);
  if (final) $(key).value = S[key];
  render();
}
['f','r'].forEach(k => {
  $(k).addEventListener('input', e => teeth(k, e.target.value, false));
  $(k).addEventListener('change', e => teeth(k, e.target.value || S[k], true));
});
document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.step;
  teeth(k, S[k] + parseInt(b.dataset.d, 10), true);
}));
$('wheel-sel').addEventListener('change', e => {
  const custom = e.target.value === 'custom';
  $('custom').hidden = !custom;
  S.mm = custom ? (parseFloat($('custom').value) || 2105) : +e.target.value;
  render();
});
$('custom').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  if (v >= 1000 && v <= 3000){ S.mm = v; render(); }
});
document.querySelectorAll('[data-cd]').forEach(b => b.addEventListener('click', () => {
  S.cad = clamp(S.cad + parseInt(b.dataset.cd, 10), 60, 130); render();
}));
$('alts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.f = +b.dataset.f; S.r = +b.dataset.r;
  $('f').value = S.f; $('r').value = S.r;
  render();
});
document.querySelectorAll('[data-unit]').forEach(b => b.addEventListener('click', () => {
  S.unit = b.dataset.unit;
  document.querySelectorAll('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));

try {
  const saved = JSON.parse(localStorage.getItem('fixie2') || 'null');
  if (saved){
    Object.assign(S, saved);
    $('f').value = S.f; $('r').value = S.r;
    const opt = [...$('wheel-sel').options].find(o => o.value === String(S.mm));
    if (opt) $('wheel-sel').value = opt.value;
    else { $('wheel-sel').value = 'custom'; $('custom').hidden = false; $('custom').value = S.mm; }
    document.querySelectorAll('[data-unit]').forEach(x => x.setAttribute('aria-pressed', x.dataset.unit === S.unit));
  }
} catch(e){}
render();
</script>
</body>
</html>
